<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食介紹網站</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>歡迎來到美食介紹網站</h1>
    </header>
    <main>
        <section id="food-list">
            <h2>美食清單</h2>
            <ul id="foods">
                <!-- 美食項目將由 JavaScript 動態載入 -->
            </ul>
        </section>
        <div id="food-details">
            <h3 id="food-title"></h3>
            <p id="food-description"></p>
            <button id="close-details">關閉</button>
        </div>
    </main>
    <footer>
        <p>© 2025 美食介紹網站</p>
    </footer>
</body>
</html>
